<!doctype html>
<html lang="pt-BR" data-required-environment="mapa_ocupacao" class="manager-auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido de inventário | Portal Sueds</title>
  <script src="/manager-auth.js"></script>
  <link rel="stylesheet" href="/mapa-ocupacao.css">
</head>
<body>
<main class="occupancy-page">
  <h1>Pedido de inventário</h1>
  <p id="escopo"></p>
  <p id="estado" role="status"></p>
  <section id="noite" class="occupancy-hotel occupancy-scroll" hidden>
    <h2 id="data"></h2>
    <table class="occupancy-table"><thead><tr><th>Categoria</th><th>Ocupados a lançar</th></tr></thead><tbody></tbody></table>
  </section>
  <button hidden id="iniciar" type="button" class="button primary">Abrir pedido na extensão</button>
  <button hidden id="registrar" type="button" class="button primary">Registrar noite salva na Omnibees</button>
  <button hidden id="interromper" type="button" class="button">Interromper pedido</button>
  <a href="/gestores?modulo=inventario" target="_top">Voltar ao inventário</a>
</main>
<script type="module" src="/pedido-inventario-codex.mjs"></script>
</body>
</html>
